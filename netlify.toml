# Netlify Build Configuration
[build]
  command = "npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "20"

# Redirect Netlify subdomain to canonical domain
[[redirects]]
from = "https://omurgam.netlify.app/*"
to = "https://omurgam.com/:splat"
status = 301
force = true

# SPA routing + gerçek 404 (soft-404 düzeltmesi)
# Bilinen tüm route'lar index.html'e 200 ile rewrite edilir (SPA bozulmaz, refresh çalışır).
# Statik dosyalar (assets, sitemap.xml, robots.txt) ve /blog-sitemap.xml fonksiyonu
# bu kurallardan ÖNCE servis edildiği için etkilenmez.
# En sondaki kural: listede olmayan (gerçekten var olmayan) URL'ler HTTP 404 alır.
# ÖNEMLİ: Yeni bir route eklenirse buraya da eklenmeli, yoksa 404 döner.

# --- Statik (tam eşleşen) route'lar ---
[[redirects]]
