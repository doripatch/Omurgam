# --- Dinamik route'lar (prefix) ---
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/video/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/soru/*"
  to = "/index.html"
  status = 200
[[redirects]]
