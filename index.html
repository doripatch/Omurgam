            var b = d && d.banners && d.banners[0];
            if (b && b.imageUrl) {
              var l = document.createElement('link');
              l.rel = 'preload'; l.as = 'image'; l.href = b.imageUrl; l.setAttribute('fetchpriority', 'high');

        }).catch(function () { return null; });
